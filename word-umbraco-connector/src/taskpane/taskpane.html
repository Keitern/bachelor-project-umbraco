<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Umbraco Connector</title>

    <!-- Office JavaScript API -->
    <script type="text/javascript" src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>

    <!-- Inter, the font used in the Figma design (falls back to Segoe UI if it can't load) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <link href="taskpane.css" rel="stylesheet" type="text/css" />
</head>

<body>
    <!-- Shown until Word has loaded the add-in -->
    <section id="sideload-msg">
        <p>Open this add-in from Word to use it.</p>
    </section>

    <main id="app-body" style="display: none;">
        <!-- Header: back arrow (hidden on step 1) and the title of the current step -->
        <header class="header">
            <button id="back" type="button" class="back hidden" aria-label="Back">
                <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M21 12H4M10 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round" />
                </svg>
            </button>
            <h1 id="title">Choose Document Type</h1>
        </header>

        <!-- Step 1: list of document types -->
        <section id="step-types" class="step">
            <ul id="type-list" class="list"></ul>
        </section>

        <!-- Step 2: existing pages of the chosen type, plus "Add new ..." -->
        <section id="step-pages" class="step hidden">
            <ul id="page-list" class="list"></ul>
            <button id="add-page" type="button" class="list-add">
                <span class="plus" aria-hidden="true">+</span>
                <span id="add-page-label">Add new page</span>
            </button>
        </section>

        <!-- Step 3: one card per field. "Fill Field" takes the marked text, the save buttons send it. -->
        <section id="step-fields" class="step hidden">
            <div id="new-name-card" class="card hidden">
                <label for="new-name" class="card-name">Name of the new page</label>
                <input id="new-name" type="text" placeholder="e.g. My new article" />
            </div>
            <div id="field-cards"></div>

            <button id="save-draft" type="button" class="primary">Save as draft</button>
            <button id="save-publish" type="button" class="primary">Save &amp; Publish</button>
        </section>

        <p id="status" class="status" role="status"></p>

        <!-- For developers only: shows Word's raw HTML, used to collect test fixtures -->
        <details class="dev">
            <summary>Developer: show selection HTML</summary>
            <button id="show-selection" type="button" class="secondary">Show selection</button>
            <label for="selection-html" class="hint">Click inside, Ctrl+A, Ctrl+C to copy:</label>
            <textarea id="selection-html" readonly rows="10" spellcheck="false"></textarea>
        </details>
    </main>
</body>

</html>
