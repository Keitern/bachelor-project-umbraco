# CI pipeline: checks the backend on every push to main.
# Runs on GitHub's servers (Ubuntu). Results: the "Actions" tab on GitHub, and a ✓ / ✗ next
# to each commit.
#
# The same checks can be run locally before pushing:
#   npm run lint
#   npm run format:check
#   npm run typecheck:backend
#   npm test -- --run
#   npm run docs            (then open docs-site/index.html to see the documentation site)

name: CI

on:
  push:
    branches: [main]

jobs:
  checks:
    name: Lint, format, typecheck and test
    runs-on: ubuntu-latest

    steps:
      # Get the repository's code
      - uses: actions/checkout@v4

      # Same Node version as locally (24 LTS). cache: npm reuses downloaded packages between runs.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # Exact versions from package-lock.json (like the partner's `npm ci`)
      - name: Install packages
        run: npm ci

      - name: ESLint
        run: npm run lint

      # `!cancelled()` = run even if the step above failed, so one run shows ALL problems
      - name: Prettier
        if: ${{ !cancelled() }}
        run: npm run format:check

      # Checks the TypeScript types. Needed because Node and Vitest run .ts files WITHOUT
      # checking types, so a type error would otherwise pass the other checks.
      - name: Typecheck
        if: ${{ !cancelled() }}
        run: npm run typecheck:backend

      # --run = run once and stop (without it, Vitest waits for file changes)
      - name: Unit tests
        if: ${{ !cancelled() }}
        run: npm test -- --run

  # Builds the documentation website from the JSDoc comments (TypeDoc) and publishes it on
  # GitHub Pages. Only runs when all checks above passed.
  # One-time setup on GitHub: Settings -> Pages -> Source: "GitHub Actions".
  docs:
    name: Publish documentation
    needs: checks
    runs-on: ubuntu-latest

    # Rights needed to publish to GitHub Pages
    permissions:
      pages: write
      id-token: write

    # Shows the site's address on the run's summary page
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install packages
        run: npm ci

      # Same as `npm run docs` locally: writes the website to docs-site/
      - name: Build documentation
        run: npm run docs

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs-site

      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
